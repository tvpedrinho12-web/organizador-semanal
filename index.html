<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060a">
<title>Ritmo</title>
<style>
  html,body{margin:0;height:100%;}
  body{background:#07060a;color:#f5f3f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    min-height:100dvh;display:flex;align-items:center;justify-content:center;text-align:center;padding:32px;}
  .box{max-width:360px;}
  h1{font-size:26px;font-weight:600;margin:0 0 12px;}
  p{font-size:15px;color:#a8a2b4;line-height:1.6;margin:0;}
</style>
<script>
  // Desregistra qualquer service worker e limpa caches (encerra PWAs instalados).
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); });
  }
  if (window.caches && caches.keys) { caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }); }
</script>
</head>
<body>
  <div class="box">
    <h1>Ritmo</h1>
    <p>Este aplicativo foi descontinuado e não está mais disponível.</p>
  </div>
</body>
</html>
